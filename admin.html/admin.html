<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin LongkaliVerse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#0f172a;color:#fff;padding:14px}h1{font-size:22px}h1 span{color:#facc15}.warn{background:#facc15;color:#000;padding:10px;border-radius:10px;font-size:13px;margin:10px 0;font-weight:700}
#preview{width:100%;height:280px;background:#87ceeb;border-radius:14px;overflow:hidden;border:3px solid #0f766e;margin:10px 0}
.card{background:#fff;color:#111;border-radius:14px;padding:12px;margin-bottom:10px}.card b{font-size:16px}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row label{font-size:12px;color:#666;flex:1;min-width:80px}.row input,.row select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:4px;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:8px}.green{background:#0f766e;color:#fff}.yellow{background:#facc15}.red{background:#ef4444;color:#fff}.gray{background:#e5e7eb}
textarea{width:100%;height:90px;padding:10px;border-radius:10px;margin-top:8px;font-size:12px}
small{color:#94a3b8}</style></head>
<body>
<h1>Admin <span>LongkaliVerse</span> 🏠</h1>
<small>Login: Pemilik • Hanya lu yang bisa buka ini</small>
<div class="warn">⚠️ Cara pakai: Ubah rumah di bawah → Klik SALIN KODE → Paste ke index.html → Save. Beres!</div>
<div id="preview"></div>
<div id="list"></div>
<button class="btn yellow" onclick="addHouse()">➕ TAMBAH RUMAH BARU</button>
<button class="btn green" onclick="copyCode()">📋 SALIN KODE RUMAH → Buat Update ke Pemain</button>
<textarea id="out" readonly placeholder="Kode rumah lu bakal muncul di sini..."></textarea>
<button class="btn gray" onclick="window.location.href='index.html'">← Balik ke Game Pemain</button>
<script>
let houses=[
{id:1,name:"Rumah Putih - Kantor Desa",x:-15,z:-15,wall:"#ffffff",roof:"#1f2937"},
{id:2,name:"Rumah Biru - Pak RT",x:15,z:-15,wall:"#ffffff",roof:"#1e40af"},
{id:3,name:"Rumah Kuning - Warung",x:-15,z:15,wall:"#fef3c7",roof:"#dc2626"},
{id:4,name:"Rumah Hijau - Masjid",x:15,z:15,wall:"#ffffff",roof:"#166534"},
];
let scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
let cam=new THREE.PerspectiveCamera(60,window.innerWidth/280,0.1,200);cam.position.set(0,22,28);cam.lookAt(0,0,0);
let ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(window.innerWidth-28,280);document.getElementById('preview').appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));let g=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0x4ade80}));g.rotation.x=-Math.PI/2;scene.add(g);
let group=new THREE.Group();scene.add(group);
function draw(){group.clear();houses.forEach(h=>{let grp=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(8,5,8),new THREE.MeshLambertMaterial({color:h.wall}));b.position.y=2.5;grp.add(b);let r=new THREE.Mesh(new THREE.ConeGeometry(6.5,3,4),new THREE.MeshLambertMaterial({color:h.roof}));r.position.y=6.5;r.rotation.y=Math.PI/4;grp.add(r);grp.position.set(h.x,0,h.z);group.add(grp);});}
function renderList(){let el=document.getElementById('list');el.innerHTML=houses.map((h,i)=>`
<div class="card"><b>🏠 Rumah ${i+1}</b><button style="float:right;border:none;background:#fee2e2;padding:6px 10px;border-radius:8px" onclick="delHouse(${i})">Hapus</button>
<div class="row"><label>Nama Rumah<input value="${h.name}" oninput="houses[${i}].name=this.value"></label></div>
<div class="row"><label>Posisi X (-30 s/d 30)<input type="number" value="${h.x}" oninput="houses[${i}].x=+this.value;draw()"></label>
<label>Posisi Z (-30 s/d 30)<input type="number" value="${h.z}" oninput="houses[${i}].z=+this.value;draw()"></label></div>
<div class="row"><label>Warna Dinding<input type="color" value="${h.wall}" oninput="houses[${i}].wall=this.value;draw()"></label>
<label>Warna Atap<input type="color" value="${h.roof}" oninput="houses[${i}].roof=this.value;draw()"></label></div></div>`).join('');draw();}
function addHouse(){houses.push({name:"Rumah Baru",x:0,z:-25,wall:"#ffffff",roof:"#dc2626"});renderList();}
function delHouse(i){if(confirm("Hapus rumah ini?")){houses.splice(i,1);renderList();}}
function copyCode(){let code=houses.map(h=>`// ${h.name}\nhouse(${h.x},${h.z},0x${h.wall.replace('#','')},0x${h.roof.replace('#','')});`).join('\n');document.getElementById('out').value=code;document.getElementById('out').select();document.execCommand('copy');alert("✅ Kode tersalin! Sekarang buka index.html, cari tulisan house(...), ganti dengan kode ini, lalu Save.");}
renderList();(function loop(){requestAnimationFrame(loop);group.rotation.y+=0.002;ren.render(scene,cam);})();
</script></body></html>
