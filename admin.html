<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Kosong</title><style>body{margin:0;font-family:Arial;background:#0f172a;color:#fff}header{padding:12px;background:#0f766e}button{padding:9px 13px;border:none;border-radius:8px;font-weight:700}canvas{width:100%;display:block;background:#4ade80}</style></head>
<body><header><b>ADMIN MAP KOSONG - BERHASIL!</b><br><small>Kalau tulisan ini muncul, berarti 404-nya udah hilang.</small></header>
<div style="padding:10px"><button onclick="setTool('rumah')" style="background:#facc15">🏠 Tambah Rumah</button> <button onclick="setTool('pohon')" style="background:#22c55e;color:#fff">🌳 Tambah Pohon</button> <button onclick="setTool('hapus')" style="background:#ef4444;color:#fff">🗑️ Hapus</button></div>
<canvas id="cv" width="600" height="600"></canvas>
<p style="padding:10px">Map kosong. Klik Tambah Rumah lalu klik di map hijau.</p>
<script>let objs=[],tool='rumah';let cv=document.getElementById('cv'),ctx=cv.getContext('2d');function draw(){ctx.fillStyle='#4ade80';ctx.fillRect(0,0,600,600);ctx.fillStyle='#334155';ctx.fillRect(280,0,40,600);ctx.fillRect(0,280,600,40);objs.forEach(o=>{let px=(o.x+50)*6,py=(o.z+50)*6;if(o.type=='rumah'){ctx.fillStyle='#fff';ctx.fillRect(px-22,py-22,44,44);ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(px,py-32);ctx.lineTo(px-30,py+5);ctx.lineTo(px+30,py+5);ctx.fill();}else{ctx.fillStyle='#78350f';ctx.fillRect(px-3,py-5,6,20);ctx.fillStyle='#166534';ctx.beginPath();ctx.arc(px,py-12,18,0,7);ctx.fill();}});}function setTool(t){tool=t;alert('Mode: '+t+' - Sekarang klik di map');}cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect();let x=Math.round((e.clientX-r.left)/r.width*100-50);let z=Math.round((e.clientY-r.top)/r.height*100-50);if(tool=='hapus'){objs=objs.filter(o=>Math.abs(o.x-x)>6||Math.abs(o.z-z)>6);}else{objs.push({x,z,type:tool});}draw();});draw();</script></body></html>
