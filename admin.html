<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin 3D Lengkap</title>
<style>body{margin:0;font-family:Arial;background:#000;overflow:hidden;color:#fff}#top{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(15,23,42,.97);padding:8px;display:flex;gap:5px;flex-wrap:wrap}#top b{width:100%;font-size:15px}#top button{padding:8px 10px;border:none;border-radius:8px;font-weight:700;font-size:12px;background:#334155;color:#fff;cursor:pointer}#top button.on{background:#facc15;color:#000}#top select{padding:8px;border-radius:8px;background:#0f172a;color:#fff;border:none;font-weight:700}#hint{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-size:11px;z-index:9;white-space:nowrap}#panel{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#1e293b;padding:10px;border-radius:16px 16px 0 0;max-height:45vh;overflow:auto}label{font-size:11px;color:#94a3b8}input,select{width:100%;padding:7px;border-radius:8px;border:none;background:#0f172a;color:#fff;margin:2px 0 5px}input[type=color]{height:36px;padding:2px}.row{display:flex;gap:6px}.row>div{flex:1}.row button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700}#list{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}#list button{background:#0f172a;color:#fff;padding:6px 9px;border-radius:20px;border:1px solid #334155;font-size:12px}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head>
<body>
<div id="top"><b>🛠️ ADMIN 3D LENGKAP - LongkaliVerse</b>
<button id="mRumah" class="on" onclick="setMode('rumah')">🏠 Rumah</button>
<button id="mJalan" onclick="setMode('jalan')">🛣️ Jalan</button>
<button id="mPohon" onclick="setMode('pohon')">🌳 Pohon</button>
<button id="mLampu" onclick="setMode('lampu')">💡 Lampu</button>
<button id="mPindah" onclick="setMode('pindah')">✋ Pilih / Geser</button>
<button id="mHapus" onclick="setMode('hapus')">🗑️ Hapus</button>
<select id="bentuk" onchange="bentukRumah=this.value"><option value="minimalis">Rumah: Minimalis</option><option value="joglo">Rumah: Joglo / Limasan</option><option value="modern">Rumah: Modern Flat</option><option value="lantai2">Rumah: 2 Lantai</option><option value="villa">Rumah: Villa Besar</option><option value="toko">Rumah: Toko / Ruko</option></select>
<button onclick="kosongkan()" style="background:#ef4444">🧹 Kosongkan</button>
<button onclick="buatKode()" style="background:#22c55e">📋 BUAT KODE</button>
</div>
<div id="hint">👆 Klik tanah untuk bangun • Geser layar putar kamera • Cubit zoom • Jalan: klik titik A lalu titik B</div>
<div id="panel">
<div id="noSel" style="font-size:13px">Pilih bentuk rumah di atas, lalu klik di tanah hijau untuk bangun. Untuk jalan, klik mode Jalan lalu klik 2 titik.</div>
<div id="editBox" style="display:none">
<div class="row"><div><label>Nama</label><input id="inNama" oninput="upd()"></div><div><label>Bentuk</label><select id="inBentuk" onchange="updBentuk()"><option value="minimalis">Minimalis</option><option value="joglo">Joglo</option><option value="modern">Modern</option><option value="lantai2">2 Lantai</option><option value="villa">Villa</option><option value="toko">Toko</option></select></div></div>
<div class="row"><div><label>Warna Dinding</label><input type="color" id="inWarna" oninput="upd()"></div><div><label>Warna Atap</label><input type="color" id="inAtap" oninput="upd()"></div><div><label>Ukuran (1-3)</label><input type="range" min="1" max="3" step="0.5" id="inSize" oninput="upd()"></div></div>
<div class="row"><button style="background:#eab308" onclick="putar()">🔄 Putar 90°</button><button style="background:#06b6d4;color:#fff" onclick="duplikat()">📄 Duplikat</button><button style="background:#ef4444;color:#fff" onclick="hapusSel()">🗑️ Hapus</button></div>
</div>
<div id="list"></div><textarea id="out" style="width:100%;height:0;opacity:0;position:absolute"></textarea>
</div>
<script>
let objs=[]; // KOSONG
let roads=[];
let mode='rumah', bentukRumah='minimalis', sel=-1, jalanStart=null;
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb);
let cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,600); let ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.9)); let dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(20,30,10); scene.add(dl);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshLambertMaterial({color:0x4ade80})); ground.rotation.x=-Math.PI/2; scene.add(ground);
let group=new THREE.Group(); scene.add(group); let roadGroup=new THREE.Group(); scene.add(roadGroup);
let ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let yaw=0.8,pitch=0.8,dist=55,isDrag=false,lastX=0,lastY=0,downX=0,downY=0,moved=false,dragObj=null;
function updateCam(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);} updateCam();
function makeRumah(o){
let g=new THREE.Group(); let s=o.size||1; let w=o.warna, a=o.atap;
let bodyMat=new THREE.MeshLambertMaterial({color:w}); let roofMat=new THREE.MeshLambertMaterial({color:a});
if(o.bentuk=='joglo'){
let b=new THREE.Mesh(new THREE.BoxGeometry(6*s,3.5*s,6*s),bodyMat); b.position.y=1.75*s; g.add(b);
let r=new THREE.Mesh(new THREE.ConeGeometry(5.2*s,3.5*s,4),roofMat); r.position.y=5.2*s; r.rotation.y=Math.PI/4; g.add(r);
let tiang=new THREE.Mesh(new THREE.CylinderGeometry(0.2*s,0.2*s,3*s),new THREE.MeshLambertMaterial({color:0x78350f})); tiang.position.set(0,1.5*s,3.2*s); g.add(tiang);
}else if(o.bentuk=='modern'){
let b=new THREE.Mesh(new THREE.BoxGeometry(7*s,3*s,5*s),bodyMat); b.position.y=1.5*s; g.add(b);
let r=new THREE.Mesh(new THREE.BoxGeometry(7.6*s,0.4*s,5.6*s),roofMat); r.position.y=3.2*s; g.add(r);
let kaca=new THREE.Mesh(new THREE.BoxGeometry(4*s,1.8*s,0.2),new THREE.MeshLambertMaterial({color:0x67e8f9})); kaca.position.set(0,1.6*s,2.6*s); g.add(kaca);
}else if(o.bentuk=='lantai2'){
let b1=new THREE.Mesh(new THREE.BoxGeometry(6*s,3*s,6*s),bodyMat); b1.position.y=1.5*s; g.add(b1);
let b2=new THREE.Mesh(new THREE.BoxGeometry(5*s,3*s,5*s),bodyMat); b2.position.y=4.5*s; g.add(b2);
let r=new THREE.Mesh(new THREE.ConeGeometry(4.8*s,2.5*s,4),roofMat); r.position.y=7.2*s; r.rotation.y=Math.PI/4; g.add(r);
}else if(o.bentuk=='villa'){
let b=new THREE.Mesh(new THREE.BoxGeometry(10*s,4*s,8*s),bodyMat); b.position.y=2*s; g.add(b);
let r=new THREE.Mesh(new THREE.ConeGeometry(7*s,3*s,4),roofMat); r.position.y=5.5*s; r.rotation.y=Math.PI/4; g.add(r);
let kolam=new THREE.Mesh(new THREE.BoxGeometry(4*s,0.3,3*s),new THREE.MeshLambertMaterial({color:0x38bdf8})); kolam.position.set(0,0.15,6*s); g.add(kolam);
}else if(o.bentuk=='toko'){
let b=new THREE.Mesh(new THREE.BoxGeometry(6*s,4*s,5*s),bodyMat); b.position.y=2*s; g.add(b);
let papan=new THREE.Mesh(new THREE.BoxGeometry(6.2*s,1.2*s,0.3),new THREE.MeshLambertMaterial({color:0xfacc15})); papan.position.set(0,3.6*s,2.6*s); g.add(papan);
let etal=new THREE.Mesh(new THREE.BoxGeometry(5*s,2*s,0.2),new THREE.MeshLambertMaterial({color:0x67e8f9})); etal.position.set(0,1.2*s,2.6*s); g.add(etal);
}else{ // minimalis
let b=new THREE.Mesh(new THREE.BoxGeometry(6*s,4*s,6*s),bodyMat); b.position.y=2*s; g.add(b);
let r=new THREE.Mesh(new THREE.ConeGeometry(5*s,3*s,4),roofMat); r.position.y=5.5*s; r.rotation.y=Math.PI/4; g.add(r);
}
let door=new THREE.Mesh(new THREE.BoxGeometry(1.4*s,2.2*s,0.2),new THREE.MeshLambertMaterial({color:0x78350f})); door.position.set(0,1.1*s,3.05*s); if(o.bentuk!='toko'&&o.bentuk!='modern') g.add(door);
g.rotation.y=(o.rot||0);
return g;
}
function build(){
group.clear(); roadGroup.clear();
roads.forEach(r=>{
let len=Math.hypot(r.x2-r.x1,r.z2-r.z1); let ang=Math.atan2(r.z2-r.z1,r.x2-r.x1);
let m=new THREE.Mesh(new THREE.BoxGeometry(len,0.2,4), new THREE.MeshLambertMaterial({color:0x334155})); m.position.set((r.x1+r.x2)/2,0.1,(r.z1+r.z2)/2); m.rotation.y=-ang; roadGroup.add(m);
let garis=new THREE.Mesh(new THREE.BoxGeometry(len,0.25,0.4), new THREE.MeshLambertMaterial({color:0xfacc15})); garis.position.set((r.x1+r.x2)/2,0.12,(r.z1+r.z2)/2); garis.rotation.y=-ang; roadGroup.add(garis);
});
objs.forEach((o,i)=>{
let g=new THREE.Group(); g.position.set(o.x,0,o.z); g.userData.idx=i; g.userData.isRoad=false;
if(o.type=='rumah') g.add(makeRumah(o));
else if(o.type=='pohon'){let t=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,3),new THREE.MeshLambertMaterial({color:o.atap})); t.position.y=1.5; g.add(t); let l=new THREE.Mesh(new THREE.SphereGeometry(2.2,8,8),new THREE.MeshLambertMaterial({color:o.warna})); l.position.y=4.2; g.add(l);}
else if(o.type=='lampu'){let t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,5),new THREE.MeshLambertMaterial({color:0x111827})); t.position.y=2.5; g.add(t); let lamp=new THREE.Mesh(new THREE.SphereGeometry(0.7,8,8),new THREE.MeshBasicMaterial({color:0xfde047})); lamp.position.y=5.2; g.add(lamp); let glow=new THREE.PointLight(0xfde047,0.6,10); glow.position.y=5.2; g.add(glow);}
if(sel==i){let ring=new THREE.Mesh(new THREE.RingGeometry(4,4.8,24),new THREE.MeshBasicMaterial({color:0xfacc15,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=0.3; g.add(ring);}
group.add(g);
});
let list=document.getElementById('list'); list.innerHTML=''; if(objs.length==0&&roads.length==0) list.innerHTML='<span style="font-size:12px;color:#94a3b8">Map kosong - '+roads.length+' jalan, '+objs.length+' bangunan</span>';
else list.innerHTML='<span style="font-size:12px;color:#94a3b8">'+roads.length+' jalan • '+objs.length+' bangunan • Klik untuk edit</span>';
objs.forEach((o,i)=>{let b=document.createElement('button'); b.textContent=(o.type=='rumah'?'🏠 ':o.type=='pohon'?'🌳 ':'💡 ')+o.nama; b.onclick=()=>pilih(i); list.appendChild(b);});
}
function setMode(m){mode=m; ['mRumah','mJalan','mPohon','mLampu','mPindah','mHapus'].forEach(id=>document.getElementById(id).classList.remove('on')); let map={rumah:'mRumah',jalan:'mJalan',pohon:'mPohon',lampu:'mLampu',pindah:'mPindah',hapus:'mHapus'}; document.getElementById(map[m]).classList.add('on'); document.getElementById('hint').innerText=m=='jalan'?'🛣️ Mode Jalan: Klik titik A, lalu klik titik B':'👆 Klik tanah untuk bangun • Geser putar kamera';}
function getGround(e){mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(mouse,cam); let h=ray.intersectObject(ground); return h.length?h[0].point:null;}
function getObj(e){mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(mouse,cam); let h=ray.intersectObjects(group.children,true); if(h.length){let g=h[0].object; while(g.parent!==group) g=g.parent; return g.userData.idx;} return -1;}
ren.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;moved=false;isDrag=true;lastX=e.clientX;lastY=e.clientY;});
ren.domElement.addEventListener('pointermove',e=>{if(!isDrag) return; if(Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6) moved=true; if(mode=='pindah'&&dragObj!==null){let p=getGround(e); if(p){objs[dragObj].x=Math.round(p.x); objs[dragObj].z=Math.round(p.z); build(); sync();} return;} if(moved){yaw-=(e.clientX-lastX)*0.01; pitch=Math.max(0.15,Math.min(1.3,pitch+(e.clientY-lastY)*0.01)); updateCam();} lastX=e.clientX; lastY=e.clientY;});
ren.domElement.addEventListener('pointerup',e=>{
isDrag=false; if(moved) return;
if(mode=='hapus'){let idx=getObj(e); if(idx>=0){objs.splice(idx,1); sel=-1; build(); sync();} return;}
if(mode=='pindah'){let idx=getObj(e); if(idx>=0){pilih(idx); dragObj=idx;} return;}
if(mode=='jalan'){let p=getGround(e); if(!p) return; if(!jalanStart){jalanStart={x:Math.round(p.x),z:Math.round(p.z)}; alert('Titik A dikunci di '+jalanStart.x+','+jalanStart.z+'. Sekarang klik titik B untuk ujung jalan.');} else {roads.push({x1:jalanStart.x,z1:jalanStart.z,x2:Math.round(p.x),z2:Math.round(p.z)}); jalanStart=null; build();} return;}
if(mode=='rumah'||mode=='pohon'||mode=='lampu'){let idx=getObj(e); if(idx>=0){pilih(idx); return;} let p=getGround(e); if(!p) return; let nm=mode=='rumah'?(bentukRumah+' '+(objs.filter(o=>o.type=='rumah').length+1)):mode=='pohon'?'Pohon '+(objs.filter(o=>o.type=='pohon').length+1):'Lampu '+(objs.filter(o=>o.type=='lampu').length+1); objs.push({x:Math.round(p.x),z:Math.round(p.z),type:mode,bentuk:bentukRumah,nama:nm,warna:mode=='rumah'?'#ffffff':mode=='pohon'?'#166534':'#facc15',atap:mode=='rumah'?'#dc2626':mode=='pohon'?'#78350f':'#111827',size:1,rot:0}); pilih(objs.length-1); build(); return;}
});
ren.domElement.addEventListener('wheel',e=>{dist=Math.max(15,Math.min(90,dist+e.deltaY*0.05)); updateCam();});
function pilih(i){sel=i; document.getElementById('noSel').style.display='none'; document.getElementById('editBox').style.display='block'; sync(); build();}
function sync(){if(sel<0) return; let o=objs[sel]; document.getElementById('inNama').value=o.nama; document.getElementById('inWarna').value=o.warna; document.getElementById('inAtap').value=o.atap; document.getElementById('inSize').value=o.size||1; document.getElementById('inBentuk').value=o.bentuk||'minimalis';}
function upd(){if(sel<0) return; let o=objs[sel]; o.nama=document.getElementById('inNama').value; o.warna=document.getElementById('inWarna').value; o.atap=document.getElementById('inAtap').value; o.size=parseFloat(document.getElementById('inSize').value); build();}
function updBentuk(){if(sel<0) return; objs[sel].bentuk=document.getElementById('inBentuk').value; build();}
function putar(){if(sel<0) return; objs[sel].rot=(objs[sel].rot||0)+Math.PI/4; build();}
function hapusSel(){if(sel<0) return; objs.splice(sel,1); sel=-1; document.getElementById('editBox').style.display='none'; document.getElementById('noSel').style.display='block'; build();}
function duplikat(){if(sel<0) return; let c={...objs[sel]}; c.x+=6; c.nama+=' Copy'; objs.push(c); pilih(objs.length-1);}
function kosongkan(){if(!confirm('Kosongkan semua? Jalan + bangunan hilang semua.'))return; objs=[]; roads=[]; sel=-1; build();}
function buatKode(){
let kode='// ADMIN 3D LENGKAP - '+objs.length+' bangunan + '+roads.length+' jalan\n';
roads.forEach(r=>{kode+=`jalan(${r.x1},${r.z1},${r.x2},${r.z2});\n`;});
objs.forEach(o=>{if(o.type=='rumah') kode+=`rumah(${o.x},${o.z},0x${o.warna.replace('#','')},0x${o.atap.replace('#','')},'${o.bentuk}',${o.size},${o.rot||0}); // ${o.nama}\n`; else if(o.type=='pohon') kode+=`pohon(${o.x},${o.z}); // ${o.nama}\n`; else kode+=`lampu(${o.x},${o.z}); // ${o.nama}\n`;});
let out=document.getElementById('out'); out.value=kode; out.select(); document.execCommand('copy'); alert('Ke-copy! '+objs.length+' bangunan + '+roads.length+' jalan. Paste ke index.html');
}
build(); (function loop(){requestAnimationFrame(loop); ren.render(scene,cam);})();
</script></body></html>
