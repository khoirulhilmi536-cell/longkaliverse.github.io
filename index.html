<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LongkaliVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;z-index:999;background:#0e4a5a;padding:10px 12px;display:flex;justify-content:space-between}
#header h1{margin:0;font-size:22px}#header h1 span{font-size:11px;background:#f59e0b;color:#000;padding:3px 7px;border-radius:6px}
#header .r{text-align:right;font-size:11px}
#header .r b{background:#134e4a;padding:3px 8px;border-radius:20px}
#marquee{position:fixed;top:56px;left:0;right:0;z-index:999;background:#facc15;color:#000;font-size:13px;font-weight:700;padding:6px;overflow:hidden;white-space:nowrap;pointer-events:none}
#marquee span{display:inline-block;animation:j 18s linear infinite}@keyframes j{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
#mapWrap{position:fixed;top:82px;left:0;right:0;bottom:62px;background:#0f172a;z-index:1}
#mapWrap canvas{position:absolute !important;top:0 !important;left:0 !important;z-index:1 !important}
#card{position:absolute;top:12px;left:12px;z-index:50;background:#fff;color:#000;border-radius:14px;padding:10px 14px;min-width:140px;border:2px solid #0ea5e9;pointer-events:none}
#card small{letter-spacing:2px;color:#0ea5e9;font-weight:900;font-size:11px}
#card b{font-size:30px}
#card p{margin:2px 0 0;font-size:11px;color:#64748b}
#online{position:absolute;top:92px;left:12px;z-index:50;background:#16a34a;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:700;pointer-events:none}
#side{position:absolute;top:12px;right:12px;z-index:100;display:flex;flex-direction:column;gap:8px}
#side button{width:44px;height:44px;border-radius:12px;border:none;background:#fff;font-size:22px;cursor:pointer}
#btnJalan{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;background:#0e4a5a;color:#fff;border:none;padding:13px 26px;border-radius:30px;font-size:16px;font-weight:800;cursor:pointer}
#btnKembali{position:fixed;top:12px;left:12px;z-index:9999;display:none;background:#ef4444;color:#fff;border:none;padding:10px 14px;border-radius:20px;font-weight:800;cursor:pointer}
#modeLabel{position:fixed;top:12px;right:12px;z-index:9999;display:none;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:20px;font-size:12px;pointer-events:none}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:999;background:#fdf6e3;display:flex;padding:6px 0 8px}
#nav button{flex:1;background:none;border:none;font-size:14px;color:#0e4a5a;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:10px 0;font-weight:900}
#nav button span{font-size:24px;pointer-events:none}
#kosongLabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(0,0,0,.6);padding:12px 18px;border-radius:14px;text-align:center;font-size:13px;pointer-events:none;display:none}
#joystick{position:fixed;bottom:30px;left:20px;z-index:9999;width:130px;height:130px;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);border-radius:50%;display:none;touch-action:none}
#knob{position:absolute;top:50%;left:50%;width:55px;height:55px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:24px;pointer-events:none}
#btnLompat{position:fixed;bottom:45px;right:20px;z-index:9999;width:70px;height:70px;border-radius:50%;background:#f59e0b;border:3px solid #fff;color:#000;font-size:28px;font-weight:900;display:none;cursor:pointer}
#npcDialog{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);z-index:9999;display:none;background:#fff;color:#111;border-radius:14px;padding:12px 14px;max-width:85%;width:340px;box-shadow:0 8px 20px rgba(0,0,0,.4);border:2px solid #0e4a5a;pointer-events:none}
#npcDialog b{color:#0e4a5a;font-size:14px}
#npcDialog p{margin:4px 0 0;font-size:14px;line-height:1.4}
#npcDialog small{font-size:11px;color:#64748b}
#npcList{position:absolute;bottom:70px;left:12px;z-index:50;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:12px;font-size:12px;pointer-events:none;max-width:220px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="header"><div><h1 id="judulDesa">LongkaliVerse <span>DAY 2</span></h1></div><div class="r"><div id="jam">Sen, 9 Nov 2026</div><div><b id="cuacaLabel">🌙 MALAM • 🌧️ HUJAN</b></div></div></div>
<div id="marquee"><span id="marqueeText">Pengumuman</span></div>
<div id="mapWrap">
<div id="kosongLabel">🌱 MAP MASIH KOSONG<br><small>Admin lagi bangun desa...</small></div>
<div id="card"><small>WARGA</small><br><b id="wargaText">4.000</b><p id="wargaUpdate">diperbarui</p></div>
<div id="online">🟢 <span id="onlineCount">1</span> warga online</div>
<div id="npcList">👥 NPC: <span id="npcCount">0</span> orang<br><small id="npcNames">-</small></div>
<div id="side"><button type="button" onclick="zoomIn()">+</button><button type="button" onclick="zoomOut()">−</button><button type="button" onclick="alert('Favorit!')">★</button></div>
<button id="btnJalan" type="button" onclick="masukJalan()">🎮 Jalan-jalan</button>
</div>
<button id="btnKembali" type="button" onclick="keluarJalan()">⬅ Kembali ke Menu</button>
<div id="modeLabel">🎮 MODE JALAN-JALAN • Deketin NPC buat ngobrol</div>
<div id="joystick"><div id="knob">🕹️</div></div>

<div id="npcDialog"><b id="npcDialogNama">Pak RT</b><p id="npcDialogIsi">Halo!</p><small>💬 Deketin NPC buat ngobrol • Jalan menjauh buat nutup</small></div>
<div id="nav">
<button type="button"><span>🗺️</span>Map</button>
</div>
<script>
// ============================================================
//  ✏️ EDIT MANUAL DI SINI - INI UDAH TERISI, TINGGAL GANTI
// ============================================================
var NAMA_DESA = "LongkaliVerse";
var DAY = "DAY 2";
var CUACA = "🌙 MALAM • 🌧️ HUJAN";
var PENGUMUMAN = "📣 Selamat datang di LongkaliVerse! • 🏠 Desa udah mulai dibangun! • 🎮 Pencet Jalan-jalan buat keliling & ngobrol sama NPC!";
var JUMLAH_WARGA = 4000;
var WARGA_ONLINE = 1;
var UPDATE_WARGA = "diperbarui 2026-11-08 17:44";

// ---------- 👥 NPC - UDAH ADA 5, BISA DITAMBAH ----------
var DAFTAR_NPC = [
  ["Pak RT", 5, 5, "biru", "Selamat datang di Longkali! Jangan lupa jaga kebersihan ya!"],
  ["Bu Sari", -8, 10, "pink", "Hari ini aku masak sayur lodeh, mampir ke rumahku yuk!"],
  ["Bang Andi", 12, -8, "hijau", "Woi! Mau ikut mancing di sungai gak sore ini?"],
  ["Mbah Joyo", -12, -12, "kuning", "Dulu desa ini masih hutan semua, nak..."],
  ["Hilmi", 0, -15, "merah", "Halo! Aku Hilmi, admin desa ini!"],
];

// ---------- 🗺️ RUMAH - UDAH TERISI, GAK PAKE // LAGI ----------
var DAFTAR_RUMAH = [
  [10, 10, "putih", "merah", "joglo", 1],
  [-15, 5, "kuning", "coklat", "modern", 1],
  [20, -15, "biru", "hitam", "toko", 1],
  [-20, -15, "hijau", "merah", "lantai2", 1],
  [15, 18, "pink", "coklat", "villa", 1],
  [-8, -20, "putih", "hitam", "joglo", 1],
];

// ---------- 🛣️ JALAN - UDAH TERISI ----------
var DAFTAR_JALAN = [
  [-30, 0, 30, 0],
  [0, -30, 0, 30],
  [-30, -20, 30, -20],
  [-20, -30, -20, 30],
];

// ---------- 🌳 POHON & 💡 LAMPU - UDAH TERISI ----------
var DAFTAR_POHON = [
  [5, -5], [-5, 5], [25, 5], [-25, -5], [8, -12], [-18, 15], [22, 12], [-5, -18],
];
var DAFTAR_LAMPU = [
  [0, 5], [0, -5], [10, 0], [-10, 0],
];
var KECEPATAN_JALAN = 0.35;
var BATAS_MAP = 48;
var JARAK_NGOBROL = 4;
// ============================================================
//  ⛔ STOP! JANGAN EDIT DI BAWAH INI
// ============================================================
var modeJalan = false;
function terapkanEdit(){
  document.getElementById('judulDesa').innerHTML = NAMA_DESA + ' <span>'+DAY+'</span>';
  document.getElementById('cuacaLabel').innerText = CUACA;
  document.getElementById('marqueeText').innerText = PENGUMUMAN;
  document.getElementById('wargaText').innerText = JUMLAH_WARGA.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  document.getElementById('onlineCount').innerText = WARGA_ONLINE;
  document.getElementById('wargaUpdate').innerText = UPDATE_WARGA;
  document.getElementById('npcCount').innerText = DAFTAR_NPC.length;
  document.getElementById('npcNames').innerText = DAFTAR_NPC.map(n=>n[0]).join(', ');
}
terapkanEdit();
function updateJam(){let d=new Date();let h=['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()];let b=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()];document.getElementById('jam').innerText=h+', '+d.getDate()+' '+b+' '+d.getFullYear()+' • '+String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0')+' WIB';}setInterval(updateJam,10000);updateJam();
let scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
let cam=new THREE.PerspectiveCamera(55,innerWidth/(innerHeight-144),0.1,500);
let ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight-144);ren.domElement.style.position='absolute';ren.domElement.style.top='0';ren.domElement.style.left='0';ren.domElement.style.zIndex='1';ren.domElement.style.touchAction='none';document.getElementById('mapWrap').prepend(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.95));let dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(20,30,10);scene.add(dl);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshLambertMaterial({color:0x4ade80}));ground.rotation.x=-Math.PI/2;scene.add(ground);
function jalan(x1,z1,x2,z2){let len=Math.hypot(x2-x1,z2-z1);let a=Math.atan2(z2-z1,x2-x1);let m=new THREE.Mesh(new THREE.BoxGeometry(len,0.2,4.5),new THREE.MeshLambertMaterial({color:0x334155}));m.position.set((x1+x2)/2,0.1,(z1+z2)/2);m.rotation.y=-a;scene.add(m);let g=new THREE.Mesh(new THREE.BoxGeometry(len,0.25,0.4),new THREE.MeshLambertMaterial({color:0xfacc15}));g.position.set((x1+x2)/2,0.12,(z1+z2)/2);g.rotation.y=-a;scene.add(g);}
function warnaWarna(w){if(w=="putih")return 0xffffff; if(w=="kuning")return 0xfacc15; if(w=="biru")return 0x3b82f6; if(w=="hijau")return 0x22c55e; if(w=="pink")return 0xec4899; return 0xffffff;}
function warnaAtap(a){if(a=="merah")return 0xdc2626; if(a=="coklat")return 0x78350f; if(a=="hitam")return 0x111827; if(a=="biru")return 0x1d4ed8; return 0xdc2626;}
function warnaBaju(w){if(w=="merah")return 0xef4444; if(w=="biru")return 0x3b82f6; if(w=="hijau")return 0x22c55e; if(w=="kuning")return 0xfacc15; if(w=="pink")return 0xec4899; if(w=="ungu")return 0x8b5cf6; if(w=="putih")return 0xffffff; if(w=="hitam")return 0x1f2937; return 0x3b82f6;}
function rumah(x,z,w,a,b,s,r){let g=new THREE.Group();g.position.set(x,0,z);s=s||1;let bm=new THREE.MeshLambertMaterial({color:warnaWarna(w)});let rm=new THREE.MeshLambertMaterial({color:warnaAtap(a)});if(b=='joglo'){let bb=new THREE.Mesh(new THREE.BoxGeometry(6*s,3.5*s,6*s),bm);bb.position.y=1.75*s;g.add(bb);let rr=new THREE.Mesh(new THREE.ConeGeometry(5.2*s,3.5*s,4),rm);rr.position.y=5.2*s;rr.rotation.y=Math.PI/4;g.add(rr);}else if(b=='modern'){let bb=new THREE.Mesh(new THREE.BoxGeometry(7*s,3*s,5*s),bm);bb.position.y=1.5*s;g.add(bb);let rr=new THREE.Mesh(new THREE.BoxGeometry(7.6*s,0.4*s,5.6*s),rm);rr.position.y=3.2*s;g.add(rr);}else if(b=='lantai2'){let b1=new THREE.Mesh(new THREE.BoxGeometry(6*s,3*s,6*s),bm);b1.position.y=1.5*s;g.add(b1);let b2=new THREE.Mesh(new THREE.BoxGeometry(5*s,3*s,5*s),bm);b2.position.y=4.5*s;g.add(b2);let rr=new THREE.Mesh(new THREE.ConeGeometry(4.8*s,2.5*s,4),rm);rr.position.y=7.2*s;rr.rotation.y=Math.PI/4;g.add(rr);}else if(b=='villa'){let bb=new THREE.Mesh(new THREE.BoxGeometry(10*s,4*s,8*s),bm);bb.position.y=2*s;g.add(bb);let rr=new THREE.Mesh(new THREE.ConeGeometry(7*s,3*s,4),rm);rr.position.y=5.5*s;rr.rotation.y=Math.PI/4;g.add(rr);}else if(b=='toko'){let bb=new THREE.Mesh(new THREE.BoxGeometry(6*s,4*s,5*s),bm);bb.position.y=2*s;g.add(bb);let p=new THREE.Mesh(new THREE.BoxGeometry(6.2*s,1.2*s,0.3),new THREE.MeshLambertMaterial({color:0xfacc15}));p.position.set(0,3.6*s,2.6*s);g.add(p);}else{let bb=new THREE.Mesh(new THREE.BoxGeometry(6*s,4*s,6*s),bm);bb.position.y=2*s;g.add(bb);let rr=new THREE.Mesh(new THREE.ConeGeometry(5*s,3*s,4),rm);rr.position.y=5.5*s;rr.rotation.y=Math.PI/4;g.add(rr);}let door=new THREE.Mesh(new THREE.BoxGeometry(1.4*s,2.2*s,0.2),new THREE.MeshLambertMaterial({color:0x78350f}));door.position.set(0,1.1*s,3.05*s);if(b!='toko')g.add(door);g.rotation.y=r||0;scene.add(g);}
function pohon(x,z){let g=new THREE.Group();g.position.set(x,0,z);let t=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,3),new THREE.MeshLambertMaterial({color:0x78350f}));t.position.y=1.5;g.add(t);let l=new THREE.Mesh(new THREE.SphereGeometry(2.2,8,8),new THREE.MeshLambertMaterial({color:0x166534}));l.position.y=4.2;g.add(l);scene.add(g);}
function lampu(x,z){let t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,5),new THREE.MeshLambertMaterial({color:0x111827}));t.position.set(x,2.5,z);scene.add(t);let s=new THREE.Mesh(new THREE.SphereGeometry(0.7,8,8),new THREE.MeshBasicMaterial({color:0xfde047}));s.position.set(x,5.2,z);scene.add(s);}
DAFTAR_JALAN.forEach(j=>jalan(j[0],j[1],j[2],j[3]));
DAFTAR_RUMAH.forEach(r=>rumah(r[0],r[1],r[2],r[3],r[4],r[5]));
DAFTAR_POHON.forEach(p=>pohon(p[0],p[1]));
DAFTAR_LAMPU.forEach(l=>lampu(l[0],l[1]));
let npcListObj = [];
function buatLabelNama(nama){
  let c=document.createElement('canvas'); c.width=256; c.height=64;
  let ctx=c.getContext('2d'); ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,256,64);
  ctx.fillStyle='#fff'; ctx.font='bold 28px Arial'; ctx.textAlign='center'; ctx.fillText(nama,128,42);
  let tex=new THREE.CanvasTexture(c); let mat=new THREE.SpriteMaterial({map:tex, transparent:true});
  let spr=new THREE.Sprite(mat); spr.scale.set(4,1,1); spr.position.y=4.2; return spr;
}
function buatNPC(nama,x,z,warnaBaju,dialog){
  let g=new THREE.Group(); g.position.set(x,0,z);
  let badan=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.7,1.8,8), new THREE.MeshLambertMaterial({color:warnaBaju(warnaBaju)})); badan.position.y=1.2; g.add(badan);
  let kepala=new THREE.Mesh(new THREE.SphereGeometry(0.6,8,8), new THREE.MeshLambertMaterial({color:0xfde68a})); kepala.position.y=2.6; g.add(kepala);
  let mataKiri=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6), new THREE.MeshBasicMaterial({color:0x000000})); mataKiri.position.set(-0.2,2.7,0.55); g.add(mataKiri);
  let mataKanan=mataKiri.clone(); mataKanan.position.x=0.2; g.add(mataKanan);
  let tanda=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8), new THREE.MeshBasicMaterial({color:0xfacc15})); tanda.position.y=3.6; g.add(tanda);
  g.add(buatLabelNama(nama));
  scene.add(g);
  npcListObj.push({group:g, nama:nama, dialog:dialog, x0:x, z0:z, t:Math.random()*10});
  return g;
}
DAFTAR_NPC.forEach(n=>buatNPC(n[0], n[1], n[2], n[3], n[4]));
let pemain=new THREE.Group();let badan=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.7,1.8,8),new THREE.MeshLambertMaterial({color:0xef4444}));badan.position.y=1.2;pemain.add(badan);let kepala=new THREE.Mesh(new THREE.SphereGeometry(0.6,8,8),new THREE.MeshLambertMaterial({color:0xfde68a}));kepala.position.y=2.6;pemain.add(kepala);scene.add(pemain);
let yaw=0.8,pitch=0.9,dist=48;
let joyX=0,joyY=0,isJoy=false,joyId=null,lompatY=0,isLompat=false;
function lompat(){if(isLompat)return;isLompat=true;lompatY=0;}
function updateCam(){if(!modeJalan){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);}else{cam.position.set(pemain.position.x+Math.sin(yaw)*8,pemain.position.y+5,pemain.position.z+Math.cos(yaw)*8);cam.lookAt(pemain.position.x,pemain.position.y+2,pemain.position.z);}}updateCam();
function masukJalan(){modeJalan=true;document.getElementById('header').style.display='none';document.getElementById('marquee').style.display='none';document.getElementById('nav').style.display='none';document.getElementById('kosongLabel').style.display='none';document.getElementById('mapWrap').style.top='0';document.getElementById('mapWrap').style.bottom='0';document.getElementById('btnKembali').style.display='block';document.getElementById('modeLabel').style.display='block';document.getElementById('joystick').style.display='block';document.getElementById('btnLompat').style.display='block';ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();updateCam();}
function keluarJalan(){modeJalan=false;joyX=0;joyY=0;document.getElementById('header').style.display='flex';document.getElementById('marquee').style.display='block';document.getElementById('nav').style.display='flex';document.getElementById('kosongLabel').style.display='none';document.getElementById('mapWrap').style.top='82px';document.getElementById('mapWrap').style.bottom='62px';document.getElementById('btnKembali').style.display='none';document.getElementById('modeLabel').style.display='none';document.getElementById('joystick').style.display='none';document.getElementById('btnLompat').style.display='none';document.getElementById('npcDialog').style.display='none';ren.setSize(innerWidth,innerHeight-144);cam.aspect=innerWidth/(innerHeight-144);cam.updateProjectionMatrix();updateCam();}
function zoomIn(){dist=Math.max(15,dist-5);updateCam();}
function zoomOut(){dist=Math.min(90,dist+5);updateCam();}
let isDrag=false,lastX=0,lastY=0;
ren.domElement.addEventListener('pointerdown',e=>{isDrag=true;lastX=e.clientX;lastY=e.clientY;});
ren.domElement.addEventListener('pointermove',e=>{if(!isDrag)return;let dx=e.clientX-lastX;let dy=e.clientY-lastY;if(modeJalan){yaw-=dx*0.01;pitch=Math.max(0.2,Math.min(1.3,pitch+dy*0.005));}else{yaw-=dx*0.01;pitch=Math.max(0.2,Math.min(1.3,pitch+dy*0.01));}lastX=e.clientX;lastY=e.clientY;updateCam();});
addEventListener('pointerup',()=>isDrag=false);
let joyEl=document.getElementById('joystick');let knobEl=document.getElementById('knob');
function joyStart(e){isJoy=true;joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e);e.stopPropagation();}
function joyMove(e){if(!isJoy||e.pointerId!==joyId)return;let r=joyEl.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;let max=40;let len=Math.sqrt(dx*dx+dy*dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}knobEl.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';joyX=dx/max;joyY=dy/max;}
function joyEnd(e){if(e.pointerId!==joyId)return;isJoy=false;joyX=0;joyY=0;knobEl.style.transform='translate(-50%,-50%)';}
joyEl.addEventListener('pointerdown',joyStart);joyEl.addEventListener('pointermove',joyMove);joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
function cekNPC(){
  if(!modeJalan){ document.getElementById('npcDialog').style.display='none'; return; }
  let terdekat=null, jarakTerdekat=999;
  npcListObj.forEach(n=>{
    let d=Math.hypot(pemain.position.x-n.group.position.x, pemain.position.z-n.group.position.z);
    if(d<jarakTerdekat){ jarakTerdekat=d; terdekat=n; }
  });
  if(terdekat && jarakTerdekat < JARAK_NGOBROL){
    document.getElementById('npcDialog').style.display='block';
    document.getElementById('npcDialogNama').innerText='💬 '+terdekat.nama;
    document.getElementById('npcDialogIsi').innerText='"'+terdekat.dialog+'"';
  } else {
    document.getElementById('npcDialog').style.display='none';
  }
}
(function loop(){requestAnimationFrame(loop);
